<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Calculator</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
background:white;
padding:30px;
border-radius:15px;
width:350px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
text-align:center;
}

h1{
margin-bottom:20px;
color:#333;
}

.input-group{
text-align:left;
margin-bottom:15px;
}

label{
font-size:14px;
color:#555;
}

input{
width:100%;
padding:10px;
margin-top:5px;
border-radius:8px;
border:1px solid #ccc;
font-size:14px;
}

input:focus{
outline:none;
border-color:#4facfe;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:0.9;
}

.result{
margin-top:20px;
padding:15px;
border-radius:10px;
background:#f3f6ff;
font-size:16px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>📚 Attendance Calculator</h1>

<div class="input-group">
<label>Total Classes</label>
<input type="number" id="totalClasses" placeholder="Enter total classes">
</div>

<div class="input-group">
<label>Classes Attended</label>
<input type="number" id="attendedClasses" placeholder="Enter attended classes">
</div>

<div class="input-group">
<label>Required Attendance (%)</label>
<input type="number" id="requiredAttendance" placeholder="Example: 80">
</div>

<button onclick="calculateAttendance()">Calculate</button>

<div class="result" id="result"></div>

</div>

<script>

function calculateAttendance(){

let total = parseInt(document.getElementById("totalClasses").value);
let attended = parseInt(document.getElementById("attendedClasses").value);
let required = parseInt(document.getElementById("requiredAttendance").value);

if(!total || !attended || !required){
document.getElementById("result").innerHTML="⚠ Please enter all values";
return;
}

let percentage = (attended/total)*100;

let output = "📊 Attendance: " + percentage.toFixed(2) + "%<br><br>";

if(percentage < required){

let needed = 0;

while(((attended+needed)/(total+needed))*100 < required){
needed++;
}

output += "⚠ Attendance below "+required+"%<br>";
output += "📚 You must attend <b>"+needed+"</b> more classes.";

}

else{

let bunk = 0;

while((attended/(total+bunk+1))*100 >= required){
bunk++;
}

output += "✅ Attendance above "+required+"%<br>";
output += "😎 You can skip <b>"+bunk+"</b> classes.";

}

document.getElementById("result").innerHTML = output;

}

</script>

</body>
</html>
